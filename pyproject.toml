[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cdd-agent"
version = "0.1.0"
description = "AI-based Commercial Due Diligence agent: five-agent pipeline with ToT thesis architecture, dual-index RAG, and enforced citation/confidence guardrails."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Mazen A. Skaf" }]

dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.7",
  "langchain-core>=0.3",
  "langchain>=0.3",
  "langchain-anthropic>=0.3",
  "crewai>=0.80",
  "chromadb>=0.5",
  "mcp>=1.2",
  "pandas>=2.2",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]
docs = ["python-pptx>=1.0", "python-docx>=1.1"]

[project.scripts]
cdd = "cdd_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cdd_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
