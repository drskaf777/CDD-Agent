[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cdd-agent"
version = "0.1.0"
description = "AI-based Commercial Due Diligence agent: five-agent pipeline with ToT thesis architecture, dual-index RAG, and enforced citation/confidence guardrails."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Mazen A. Skaf" }]

dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.7",
  "langchain-core>=0.3",
  "langchain>=0.3",
  "langchain-anthropic>=0.3",
  "chromadb>=0.5",
  "mcp>=2.0",
  "pandas>=2.2",
  "python-dateutil>=2.9",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# CrewAI is the Critic's framework (Checkpoint 4.1 s 2.4), but it declares
# >=3.10,<3.14 and ships no wheels for 3.14. Keeping it in the base dependencies
# made the whole package uninstallable on a 3.14 interpreter - including the parts
# that have nothing to do with the Critic. It is an extra so the rest installs
# everywhere; without it, the Critic raises rather than quietly substituting
# something else for the persona.
critic = ["crewai>=0.80"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "httpx>=0.27"]
docs = ["python-pptx>=1.0", "python-docx>=1.1"]

[project.scripts]
cdd = "cdd_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cdd_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/cdd_agent/web/static" = "cdd_agent/web/static"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
